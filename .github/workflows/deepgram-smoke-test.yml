name: Deepgram Voice Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Deepgram authentication and Thai model
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createVoiceTranscriber } from "./src/stt.js";

          const sampleRate = 16_000;
          const sampleCount = sampleRate / 2;
          const dataSize = sampleCount * 2;
          const wav = Buffer.alloc(44 + dataSize);
          wav.write("RIFF", 0);
          wav.writeUInt32LE(36 + dataSize, 4);
          wav.write("WAVE", 8);
          wav.write("fmt ", 12);
          wav.writeUInt32LE(16, 16);
          wav.writeUInt16LE(1, 20);
          wav.writeUInt16LE(1, 22);
          wav.writeUInt32LE(sampleRate, 24);
          wav.writeUInt32LE(sampleRate * 2, 28);
          wav.writeUInt16LE(2, 32);
          wav.writeUInt16LE(16, 34);
          wav.write("data", 36);
          wav.writeUInt32LE(dataSize, 40);

          const transcribe = createVoiceTranscriber({ model: "nova-3", language: "th" });
          if (!transcribe.available) throw new Error("DEEPGRAM_API_KEY is unavailable");
          await transcribe(wav);
          console.log(`Deepgram voice smoke test passed (${transcribe.model}/${transcribe.language})`);
          NODE
