name: Onepune 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: onepune-24-7
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    # GitHub-hosted runners have a maximum job duration. Restart before that
    # limit so schedules are reloaded with only a short handoff window.
    timeout-minutes: 350
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node src/index.js
