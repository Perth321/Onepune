name: Onepune 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: onepune-24-7
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    # GitHub-hosted runners have a maximum job duration. Restart before that
    # limit so schedules are reloaded with only a short handoff window.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org; then
              node --input-type=module -e "import('discord.js')" && exit 0
            fi
            echo "npm install failed on attempt ${attempt}; retrying..."
            rm -rf node_modules
            sleep 5
          done
          exit 1
      - name: Run Onepune bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_MODEL: ${{ vars.DEEPGRAM_MODEL || 'nova-3' }}
          DEEPGRAM_LANGUAGE: ${{ vars.DEEPGRAM_LANGUAGE || 'th' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS || 'google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,liquid/lfm-2.5-2.6b:free' }}
          AUTO_TRANSLATE_ENABLED: ${{ vars.AUTO_TRANSLATE_ENABLED || 'true' }}
          VOICE_COMMANDS_ENABLED: ${{ vars.VOICE_COMMANDS_ENABLED || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/index.js
